<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anjali ❤️ Deepak</title>
<meta name="description" content="Anjali ❤️ Deepak — Wedding Invitation">
<meta property="og:type" content="website">
<meta property="og:title" content="Anjali ❤️ Deepak">
<meta property="og:description" content="You are warmly invited to celebrate with us. Tap to open the invitation.">
<meta property="og:image" content="https://deepak3279singh-droid.github.io/anjali-weds-deepak/envelope-preview.png">
<meta property="og:image:alt" content="A royal maroon and gold wedding invitation envelope for Anjali and Deepak">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Anjali ❤️ Deepak">
<meta name="twitter:description" content="Wedding Invitation">
<meta name="twitter:image" content="https://deepak3279singh-droid.github.io/anjali-weds-deepak/envelope-preview.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#5c0716,#170208 70%);color:#f9e4a8;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;padding:22px;text-align:center}
main{width:min(100%,520px)}.eyebrow{letter-spacing:3px;text-transform:uppercase;color:#e9c879;font-size:12px;margin:0 0 14px}
h1{font-weight:400;font-size:clamp(30px,8vw,46px);margin:0 0 8px;text-shadow:0 2px 16px #d99b36}
.sub{color:#f4dca0;margin:0 0 20px;font-size:17px}
.panel{position:relative;border:1px solid #c99b48;border-radius:18px;overflow:hidden;box-shadow:0 18px 60px #0009;background:#330611}
.panel img{display:block;width:100%;height:auto}
button,.openlink{display:inline-block;margin:18px auto 0;padding:14px 25px;border:1px solid #f0cf7a;border-radius:999px;background:linear-gradient(#8d1727,#4c0713);color:#ffe5a0;font:20px Georgia,serif;text-decoration:none;box-shadow:0 4px 20px #0008;cursor:pointer}
#reveal{display:none}#reveal .panel{animation:rise .8s ease both}@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.note{font-size:13px;color:#d9bd7c;margin-top:18px}
</style>
</head>
<body>
<main>
<section id="envelope">
<p class="eyebrow">A Royal Wedding Invitation</p>
<h1>Anjali <span style="color:#e45b63">♥</span> Deepak</h1>
<p class="sub">A special invitation awaits you</p>
<div class="panel"><img src="envelope-preview.png" alt="Royal maroon and gold wedding envelope"></div>
<button type="button" id="openEnvelope">Open the Envelope</button>
<p class="note">Tap to reveal the wedding invitation</p>
</section>
<section id="reveal" aria-live="polite">
<p class="eyebrow">With love and blessings</p>
<h1>Anjali <span style="color:#e45b63">♥</span> Deepak</h1>
<p class="sub">Our Wedding Invitation</p>
<div class="panel"><img src="wedding-card-preview.png" alt="Anjali and Deepak royal wedding invitation card"></div>
<a class="openlink" href="wedding-card.html">Open Wedding Card</a>
<p class="note">Tap above to view the complete invitation and event details</p>
</section>
</main>
<script>
document.getElementById('openEnvelope').addEventListener('click',()=>{
 document.getElementById('envelope').style.display='none';
 document.getElementById('reveal').style.display='block';
 window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
